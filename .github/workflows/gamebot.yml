name: GameBot

on:
  schedule:
    - cron: "0 10 * * *"   # notícias: 1x por dia, 07:00 de Brasília
    - cron: "0 21 * * *"    # promoções: 1x por dia, 19:00 de Brasília
  workflow_dispatch:
    inputs:
      mode:
        description: "news ou deals"
        default: "news"

permissions:
  contents: write

concurrency:
  group: gamebot

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Executar
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEALS_WEBHOOK_URL: ${{ secrets.DEALS_WEBHOOK_URL }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "0 11 * * *" ]; then MODE=deals; else MODE=news; fi
          fi
          python bot.py "$MODE"
      - name: Salvar estado (evita repetir posts)
        run: |
          git config user.name "gamebot"
          git config user.email "gamebot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "atualiza estado" && git push)
